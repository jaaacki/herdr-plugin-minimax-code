id = "jaaacki.minimax-code"
name = "MiniMax Code"
version = "0.2.0"
min_herdr_version = "0.9.3"
description = "Start and track MiniMax Code agents from Herdr"
platforms = ["linux", "macos"]

# Actions appear in Herdr's action menu for the given contexts.
#   global | workspace | tab | pane | selection

[[actions]]
id = "minimax-code-start"
title = "Start MiniMax Code in this worktree"
description = "Launch `mcode` in a new pane for the active worktree"
contexts = ["workspace", "pane"]
command = ["${HERDR_PLUGIN_ROOT}/bin/mcode-plugin.sh", "start"]
