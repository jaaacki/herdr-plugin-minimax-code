id = "jaaacki.minimax-code"
name = "MiniMax Code"
version = "0.3.0"
min_herdr_version = "0.9.3"
description = "Start MiniMax Code in a new pane for the active worktree"
platforms = ["linux", "macos"]

# Actions appear in Herdr's action menu for the given contexts.
#   global | workspace | tab | pane | selection
#
# DO NOT "simplify" the `command` array below back to a direct path. Herdr does
# NOT expand ${...} inside a manifest `command` array: the array is exec'd as
# argv, and because the path contains a "/" the OS treats it as a relative path
# against the *invoking pane's cwd*, hunting for a literal directory named
# ${HERDR_PLUGIN_ROOT}. That directory does not exist -> ENOENT, silently, on
# every run. HERDR_PLUGIN_ROOT *is* set in the action's environment; the
# manifest simply has no way to interpolate it. Only a shell can, hence
# /bin/sh -c. The \" escaping below is required: a \$ escape is invalid TOML
# and fails the same way.

[[actions]]
id = "minimax-code-start"
title = "Start MiniMax Code in this worktree"
description = "Launch `mcode` in a new pane for the active worktree"
contexts = ["workspace", "pane"]
command = ["/bin/sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/mcode-plugin.sh\" start"]

# ---------------------------------------------------------------------------
# There is deliberately NO [[events]] block. This is a decision, not an
# oversight. Issue #41 asked for a `pane.agent_status_changed` hook; the
# answer after measuring herdr 0.9.3 is that no hook is the correct amount of
# hook. Four independent reasons, each sufficient on its own.
#
# 1. IT WOULD DUPLICATE A NOTIFICATION HERDR ALREADY SENDS.
#    herdr has a native semantic notification system with two named categories
#    in its own config (herdr --default-config, [ui.sound]):
#        done_path     = "sounds/done.mp3"    # "overrides only finished notifications"
#        request_path  = "sounds/request.mp3" # "overrides only needs-attention notifications"
#    A notification on mcode becoming idle restates "finished". A notification
#    on mcode becoming blocked restates "needs-attention". The user already
#    gets both from herdr itself, so a plugin hook would be a second, noisier
#    copy of a message they are already being sent.
#
# 2. THE ONE NOTIFICATION HERDR *CANNOT* SEND HAS NOTHING TO FIRE ON.
#    The signal herdr cannot infer for mcode is `blocked` - no screen
#    detection manifest exists, so herdr never classifies mcode as needing
#    attention on its own. But bin/mcode-watch.sh deliberately never reports
#    `blocked` either: mcode runs at Full access in the environments this
#    plugin targets, so no blocked screen has ever been captured and guessing
#    one would be a lie. A blocked-notification hook would therefore never
#    fire - a dead hook, which is the thing #41 exists to avoid.
#
# 3. THE EVENT IS A MIRROR OF THIS PLUGIN'S OWN REPORTING.
#    `pane.agent_status_changed` fires when *someone* calls
#    `pane report-agent`. Everything that reports mcode state is this plugin:
#    bin/mcode-plugin.sh registers the pane as `idle` at launch,
#    bin/mcode-session.sh attaches the session identity, and
#    bin/mcode-watch.sh reports transitions. So a hook could only tell the
#    plugin what the plugin had just told herdr. It carries no information the
#    reporters lack, and it cannot replace the watcher's polling - the polling
#    is what produces the event.
#
# 4. THE HOOK IS SESSION-WIDE AND THE PLUGIN CANNOT SCOPE IT.
#    Measured: a hook on `pane.agent_status_changed` fires for an agent this
#    plugin never launched - a pane reported as `agent: "claude"` by an
#    unrelated source triggered it. The reporters above do namespace themselves
#    (bin/mcode-plugin.sh uses `--source herdr:minimax-code`, bin/mcode-session.sh
#    defaults to `jaaacki.minimax-code` - two different namespaces, worth
#    reconciling separately), but a namespace is NOT carried on the event. The
#    payload is pane_id, workspace_id, agent_status and agent, and nothing else,
#    so a handler cannot ask "did I report this?" - only "is the label the one I
#    use?", which any other reporter can produce. Every notification this plugin
#    emitted would be a claim about a pane it may not own.
#
# WHAT WOULD CHANGE THIS DECISION. If mcode ever grows a screen shape that
# means "waiting on the user" (a permission prompt, a question), the watcher
# can classify it, `blocked` becomes real, and reason 2 stops applying - a
# notification there would be a capability herdr genuinely cannot supply.
# That is the case worth building for, and it needs an mcode snapshot first.
#
# IF YOU ADD AN [[events]] BLOCK ANYWAY - the two gates, both required:
#   a) `herdr plugin list --json` shows an EMPTY `.warnings` array for this
#      plugin. The field is `warnings`, PLURAL - querying `.warning` returns
#      nothing and looks like "no warnings" for a hook that does not exist.
#      A misspelled event name warns: e.g. `pane_agent_status_changed`
#      (underscored) yields ["unknown event 'pane_agent_status_changed'"].
#      Only the dotted subscription vocabulary binds.
#   b) The hook is proven to RUN against a real event. A manifest entry that
#      parses is not a working hook; that conflation is the Epic 1 defect.
# See issue #41 for the measurements behind every claim above.
# ---------------------------------------------------------------------------
