id = "jaaacki.minimax-code"
name = "MiniMax Code"
version = "0.4.0"
min_herdr_version = "0.9.3"
description = "Start MiniMax Code in a new pane for the active worktree"
platforms = ["linux", "macos"]

# Actions appear in Herdr's action menu for the given contexts.
#   global | workspace | tab | pane | selection
#
# DO NOT "simplify" the `command` array below back to a direct path. Herdr does
# NOT expand ${...} inside a manifest `command` array: the array is exec'd as
# argv, and because the path contains a "/" the OS treats it as a relative path
# against the *invoking pane's cwd*, hunting for a literal directory named
# ${HERDR_PLUGIN_ROOT}. That directory does not exist -> ENOENT, silently, on
# every run. HERDR_PLUGIN_ROOT *is* set in the action's environment; the
# manifest simply has no way to interpolate it. Only a shell can, hence
# /bin/sh -c. The \" escaping below is required: a \$ escape is invalid TOML
# and fails the same way.

[[actions]]
id = "minimax-code-start"
title = "Start MiniMax Code in this worktree"
description = "Launch `mcode` in a new pane for the active worktree"
contexts = ["workspace", "pane"]
command = ["/bin/sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/mcode-plugin.sh\" start"]

# ---------------------------------------------------------------------------
# Lifecycle, NOT notification. Read this before adding a second event or
# repurposing this one.
#
# Issue #41 asked for a `pane.agent_status_changed` hook to send a
# NOTIFICATION, and the answer after measuring herdr 0.9.3 was no. That
# decision was written down in this file with four reasons, and the block was
# deleted by #84 - which is not a case of someone relitigating it, so here is
# exactly what changed and what did not.
#
# WHAT #84 CHANGED. Reason 3 said the event is a mirror of this plugin's own
# reporting: every pane that reports mcode state was launched by this plugin,
# so a hook could only tell the plugin what the plugin had just told herdr.
# That was true, and it stopped being true. `pane.agent_status_changed` fires
# for reporters this plugin does NOT own - flock's `adopt --agent minimax-code`
# and a hand-run `mcode` in any pane. Issue #84 is the report: 6 minimax-code
# panes in `herdr agent list`, zero watchers, states frozen in both directions.
# Those panes need a watcher and nothing in this plugin was going to start one,
# because this plugin never saw them.
#
# MEASURED, herdr 0.9.3, isolated throwaway instance (issue #84, in the PR):
#   self-report via `--source flock:adopt`  -> hook FIRED, payload carries
#                                              agent "minimax-code"
#   state change by that reporter          -> hook FIRED
#   our own `--source herdr:minimax-code`  -> hook FIRED
#   control, agent "claude", unrelated src  -> hook FIRED
#   three IDENTICAL re-reports of one state -> 0 extra events
# That last line is the one that makes a hook safe here: the event fires on a
# TRANSITION, not per report, so a watcher polling a steady pane does not
# re-trigger the hook that started it.
#
# WHAT #84 DID NOT CHANGE. Reasons 1, 2 and 4 were all about NOTIFICATIONS and
# none of them is an argument against a lifecycle hook, which sends nothing to
# anyone. They still stand, unchanged, and a notification hook must still not
# be added on this reasoning:
#   1. herdr already has semantic notifications (done_path / request_path in
#      its own [ui.sound]); a second copy of "finished" is noise.
#   2. the signal herdr cannot infer for mcode is `blocked`, and
#      bin/mcode-watch.sh deliberately never reports it - no blocked screen has
#      ever been captured, so the hook would be a dead hook.
#   4. the hook is session-wide. STILL TRUE, and still handled rather than
#      waved at: the event carries no `--source`, so a handler cannot ask "did I
#      report this?". It CAN ask "is the agent label mine?", and that is what
#      `ensure-watcher` gates on before it does anything. A `claude` pane is
#      named in the payload and is left alone.
#
# WHY A HOOK RATHER THAN THE SUPERVISOR #84 allowed. #84 permits a singleton
# supervisor "if the event does not fire for a self-reported registration". It
# does fire - see the measurement above - so the supervisor is not needed, and
# a daemon is a strictly worse answer: PID bookkeeping, reaping and an orphan
# sweep, to learn a fact herdr will simply hand us.
#
# THE TWO GATES FROM #41, BOTH NOW SATISFIED. Kept because they are the reason
# this block is trustworthy at all:
#   a) `herdr plugin list --json` shows NO `warnings` for this plugin. The field
#      is `warnings`, PLURAL - querying `.warning` returns nothing and looks
#      like "no warnings" for a hook that does not exist. A misspelled event
#      name warns, e.g. the underscored `pane_agent_status_changed`. Only the
#      dotted subscription vocabulary binds.
#   b) The hook is PROVEN TO RUN against a real event. A manifest entry that
#      parses is not a working hook; that conflation is the Epic 1 defect. The
#      measurement above is gate (b) - the payload lines are real captured
#      output, not a manifest that loaded cleanly.
# ---------------------------------------------------------------------------
[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/mcode-plugin.sh\" ensure-watcher"]
