name: Release

# Triggered by pushing a v* tag. This workflow does NOT create tags or cut
# releases on its own — tagging is the architect's call at the release gate.
#
# The plugin is `herdr-plugin.toml` plus three bash scripts under bin/. There is
# no build step and no compiled binary. The tarball below is a *pinned
# convenience*, not the install path: `herdr plugin install
# jaaacki/herdr-plugin-minimax-code` clones from the GitHub shorthand and
# remains the supported way to install.

on:
  push:
    tags:
      - 'v*'

# Narrower than the CI workflow's contents: read. This job creates a release and
# uploads an asset, so it needs write, and nothing else.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish the pinned tarball
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the tagged revision
        uses: actions/checkout@v7
        with:
          # Fetch the tag itself so `git archive` can archive the exact commit
          # that was tagged, not whatever the default branch points at now.
          fetch-depth: 0

      - name: "Guard: the tagged commit must already be on main"
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This workflow fires on any v* tag, from any branch. A release cut from
          # a feature branch would be indistinguishable from a real one to anyone
          # who installs from it, so refuse to publish unreleased work.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

          if ! git merge-base --is-ancestor "${VERSION}" origin/main; then
            echo "REFUSING TO PUBLISH: tag ${VERSION} is not reachable from origin/main." >&2
            echo "A release must ship a commit that is already on main." >&2
            echo "Merge the commit to main first, or cut the tag from main." >&2
            echo "--- commits in the tag but not on main ---" >&2
            git log --oneline "origin/main..${VERSION}" >&2 || true
            exit 1
          fi

          echo "OK: ${VERSION} is reachable from origin/main."

      - name: Build the tarball with git archive
        id: build
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # ALLOWLIST, not a denylist. `git archive HEAD` with no path list ships
          # PLAN.md and HANDOFF.md, which are architect-only working notes and
          # must never reach a distributed artifact. Listing the paths we want
          # means a future internal note cannot leak by accident.
          #
          # Every bin/ script is listed EXPLICITLY, and all three are listed
          # because all three are user-facing: the manifest action runs
          # bin/mcode-plugin.sh, the README tells a user to run
          # `bin/mcode-watch.sh <PANE_ID>` (README, "State reporting"), and the
          # release notes name bin/mcode-session.sh as the session registrar.
          # An allowlist that drifts from what the documentation tells a user to
          # run is how v0.3.0 shipped a tarball whose own README told a user to
          # run a command the archive did not contain. The required-contents
          # check below is what keeps the two in step; neither is sufficient
          # alone.
          #
          # agent-detection/ ships because a SHIPPED suite needs it.
          # tests/agent-detection-run.sh resolves ../agent-detection/minimax-code.toml
          # from the extracted copy, so leaving this directory out installs a
          # bundled test that cannot run. The manifest is not read at runtime --
          # nothing in the plugin loads it -- but the release notes ship
          # tests/, and a test that fails on arrival tells a user the tarball is
          # broken when the tarball is fine. Verified against the published
          # v0.3.0 asset, where the directory was absent and the suite failed.
          #
          # The exec bit is carried through from git's tree mode (100755 on all
          # three); the verification step proves it survived.
          git archive \
            --format=tar.gz \
            --output="herdr-plugin-minimax-code-${VERSION}.tar.gz" \
            "${VERSION}" \
            herdr-plugin.toml \
            bin/mcode-plugin.sh \
            bin/mcode-watch.sh \
            bin/mcode-session.sh \
            agent-detection/ \
            README.md \
            LICENSE \
            CLAUDE.md \
            tests/

          sha256sum "herdr-plugin-minimax-code-${VERSION}.tar.gz" > sha256.txt
          cut -d' ' -f1 sha256.txt > sha256.parsed
          echo "sha256=$(cat sha256.parsed)" >> "$GITHUB_OUTPUT"
          cat sha256.txt

      - name: Verify the artifact before publishing it
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf "herdr-plugin-minimax-code-${VERSION}.tar.gz" -C "$work"

          # 1. Required contents.
          #
          #    The two bin/ scripts added in Epic 3 were missing from v0.3.0's
          #    allowlist while the README told users to run one of them. The fix
          #    is not just adding two names to this list — a hand-maintained list
          #    is exactly what drifted. Check 1b below derives the requirement
          #    from the documentation itself, so the next script added to bin/
          #    is covered without anyone remembering to edit this list.
          for f in herdr-plugin.toml bin/mcode-plugin.sh bin/mcode-watch.sh \
                   bin/mcode-session.sh README.md LICENSE CLAUDE.md \
                   agent-detection/minimax-code.toml \
                   tests/run.sh tests/fake-herdr; do
            if [ ! -f "$work/$f" ]; then
              echo "MISSING from artifact: $f" >&2
              echo "If this is a user-facing script, add it to the allowlist above." >&2
              exit 1
            fi
          done

          # 1b. Everything the shipped documentation tells a user to RUN must be
          #     in the artifact. Derived from the README, not hand-listed, so
          #     documentation and artifact cannot drift apart again.
          #
          #     This is the check that would have caught v0.3.0: the README says
          #     `bin/mcode-watch.sh <PANE_ID>`, the tarball did not contain that
          #     file, and nothing in the workflow noticed.
          missing=0
          while IFS= read -r script; do
            if [ ! -f "$work/$script" ]; then
              echo "README tells a user to run '$script', but it is NOT in the artifact." >&2
              missing=1
            fi
          done < <(grep -oE 'bin/[A-Za-z0-9._-]+\.sh' "$work/README.md" | sort -u)
          if [ "$missing" -ne 0 ]; then
            echo "The artifact cannot ship documentation that names a missing command." >&2
            exit 1
          fi

          # 2. Architect-only notes must not ship.
          for f in PLAN.md HANDOFF.md; do
            if [ -e "$work/$f" ]; then
              echo "LEAK: $f must not be in the distributed artifact" >&2
              exit 1
            fi
          done

          # 3. The exec bit must survive the archive. A tarball that loses it
          #    installs a plugin that fails at invocation with a permission
          #    error, which is exactly the bug class this repo already shipped
          #    once (see HANDOFF). All three bin/ scripts are listed: the README
          #    tells a user to run the watcher directly, so a non-executable
          #    watcher is a user-facing break, not an internal one.
          for f in bin/mcode-plugin.sh bin/mcode-watch.sh bin/mcode-session.sh \
                   tests/run.sh; do
            if [ ! -x "$work/$f" ]; then
              echo "EXEC BIT LOST on $f" >&2
              ls -l "$work/$f" >&2
              exit 1
            fi
          done

          # 4. Every shipped script must parse from the extracted copy.
          for f in bin/mcode-plugin.sh bin/mcode-watch.sh bin/mcode-session.sh; do
            bash -n "$work/$f"
          done

          # 5. And EVERY bundled suite must pass from the extracted copy.
          #
          #    Globbed, not named. This step ran tests/run.sh alone, so the four
          #    other suites that ship inside the tarball were never run against
          #    the artifact. That is not hypothetical: the published v0.3.0
          #    asset ships five suites, four of which pass and
          #    tests/agent-detection-run.sh fails on arrival with
          #    "preflight: .../agent-detection/minimax-code.toml is missing" --
          #    a release that passed its own verification step while shipping a
          #    broken bundled test.
          #
          #    CI already learned this lesson with tests/*run.sh (see ci.yml,
          #    issue #35): a suite gets written, proved locally, and never
          #    executes, so it rots silently. A release that re-hardcodes the
          #    list re-arms the identical trap.
          #
          #    The nullglob guard is the part that keeps the glob honest -- if it
          #    ever stops matching, this must fail loudly rather than pass
          #    vacuously with an empty list.
          (
            cd "$work"
            shopt -s nullglob
            suites=(tests/*run.sh)
            if [ ${#suites[@]} -eq 0 ]; then
              echo "REFUSING TO PUBLISH: the artifact ships no test suite" >&2
              exit 1
            fi
            for suite in "${suites[@]}"; do
              echo "=== $suite ==="
              "$suite"
            done
          )

          # 6. bin/ must be COMPLETE, measured against the tagged tree rather
          #    than against the lists above.
          #
          #    Check 1b derives from the README, which is the right instinct
          #    but cannot see a script the README never names -- bin/mcode-session.sh
          #    is named only in the release notes, so if it went missing again,
          #    check 1b would stay green. Diffs both directions: a file in the
          #    tag but not the artifact, and a file in the artifact but not the
          #    tag. A script added tomorrow needs no edit anywhere.
          mapfile -t want_bin < <(git ls-tree -r --name-only "${VERSION}" -- bin/ | grep -E '\.sh$')
          if [ "${#want_bin[@]}" -eq 0 ]; then
            echo "REFUSING TO PUBLISH: ${VERSION} contains no bin/*.sh to verify" >&2
            exit 1
          fi
          for f in "${want_bin[@]}"; do
            if [ ! -f "$work/$f" ]; then
              echo "MISSING from artifact: $f -- it exists in ${VERSION}, so the" \
                   "allowlist is no longer covering the tree" >&2
              exit 1
            fi
          done
          mapfile -t got_bin < <(cd "$work" && find bin -type f | LC_ALL=C sort)
          mapfile -t want_sorted < <(printf '%s\n' "${want_bin[@]}" | LC_ALL=C sort)
          if [ "$(printf '%s\n' "${got_bin[@]}")" != "$(printf '%s\n' "${want_sorted[@]}")" ]; then
            echo "bin/ in the artifact does not match bin/ in ${VERSION}:" >&2
            diff <(printf '%s\n' "${want_sorted[@]}") \
                 <(printf '%s\n' "${got_bin[@]}") >&2 || true
            exit 1
          fi

          # 7. No absolute home directory may ship.
          #
          #    The published v0.3.0 asset carried /Users/noonoon eight times, in
          #    three captured JSON responses and two captured screens, after the
          #    fixture READMEs had already been cleaned -- because nothing
          #    looked. The same argument that produced checks 1 and 1b applies
          #    here: a leak nobody checks for is a leak that recurs.
          #
          #    If a legitimate example ever needs a literal /Users/ path, render
          #    it as `~` like the rest of the fixtures rather than widening this
          #    check -- a denylist taught to tolerate its own match is how the
          #    allowlist went stale in the first place.
          if grep -rIl '/Users/' "$work" >/dev/null 2>&1; then
            echo "LEAK: an absolute /Users/ home path would ship in this artifact:" >&2
            grep -rIn '/Users/' "$work" | head -20 >&2
            echo "Render it as ~ instead." >&2
            exit 1
          fi

          echo "--- artifact contents ---"
          tar -tvzf "herdr-plugin-minimax-code-${VERSION}.tar.gz"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 sha256.txt)"

          cat > release-notes.md <<EOF
          ## What this is

          A **pinned** copy of the plugin at tag \`${VERSION}\`. It is a convenience for
          anyone who does not want to track \`main\`: the tarball is a fixed, auditable
          artifact whose contents you can read with \`tar -tzf\` before running anything.

          It is **not** the install path. The supported install is still:

          \`\`\`sh
          herdr plugin install jaaacki/herdr-plugin-minimax-code
          \`\`\`

          That clones from the GitHub shorthand and picks up the latest \`main\`. Use the
          tarball when you want a fixed revision instead.

          There is no build step and no compiled binary. The plugin is
          \`herdr-plugin.toml\` plus three bash scripts: \`bin/mcode-plugin.sh\` (the
          entrypoint the action runs), \`bin/mcode-watch.sh\` (the state watcher the
          README tells you to run) and \`bin/mcode-session.sh\` (the session
          registrar). The tarball is built with \`git archive\`, so its contents are
          exactly what is committed at this tag — no working-tree drift, no
          \`.gitignore\`d files.

          ## Verify what you downloaded

          A \`sha256.txt\` asset is attached next to the tarball. Check it with:

          \`\`\`sh
          sha256sum -c sha256.txt
          \`\`\`

          That should print \`herdr-plugin-minimax-code-${VERSION}.tar.gz: OK\`. If you
          would rather compare by hand, the expected line is exactly:

          \`\`\`
          ${sha}  herdr-plugin-minimax-code-${VERSION}.tar.gz
          \`\`\`

          ## Install from the tarball

          The archive puts files at its **root** — there is no versioned top-level
          directory — so the manifest sits directly in whatever directory you extract
          into. Extract into a directory of its own so you link the plugin and not
          your current working directory:

          \`\`\`sh
          mkdir -p ./minimax-code-plugin
          tar -xzf herdr-plugin-minimax-code-${VERSION}.tar.gz -C ./minimax-code-plugin
          herdr plugin link ./minimax-code-plugin
          \`\`\`

          If you already have a copy of this plugin linked, unlink it first with
          \`herdr plugin unlink jaaacki.minimax-code\`; Herdr will not register a
          second copy over an existing one.

          Then invoke the action from the Herdr action menu, or:

          \`\`\`sh
          herdr plugin action invoke jaaacki.minimax-code.minimax-code-start
          \`\`\`

          ## Testing

          The tarball ships the test suite. From the extracted directory:

          \`\`\`sh
          ./tests/run.sh
          \`\`\`

          It points \`HERDR_BIN_PATH\` at \`tests/fake-herdr\`, so it needs no running
          Herdr. It covers the launcher's argv construction and its failure branches.
          It does **not** exercise Herdr's own action-spawn path, which is only
          reachable through a live \`herdr plugin action invoke\`.
          EOF

          gh release create "${VERSION}" \
            --title "MiniMax Code herdr plugin ${VERSION}" \
            --notes-file release-notes.md \
            --generate-notes \
            "herdr-plugin-minimax-code-${VERSION}.tar.gz" \
            "sha256.txt"
